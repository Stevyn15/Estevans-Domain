<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <!-- csp:start --><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-+mly31C+QQSAeXrtrKLIXFjPzAin+3Nu2O5/lqJcZv8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><!-- csp:end -->
  <meta name="referrer" content="no-referrer">
  <title>Pixel Realms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <canvas id="c"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="hurt"></div>
    <div id="top-left">
      <div id="coinChip" class="chip">🪙 <span id="coinCount">0</span></div>
      <div class="chip pass" title="Battle pass progress"><span id="passTier">T0</span><div id="passBar" class="bar"><i></i></div></div>
    </div>
    <button id="btnPause" class="iconbtn" aria-label="Pause">❚❚</button>
    <button id="btnRec" class="iconbtn" aria-label="Record clip">⏺</button>
    <div id="royaleHud" class="hidden">
      <div class="chip" id="rAlive">👥 8</div>
      <div class="chip" id="rStorm">🌀 --</div>
      <div class="chip" id="rAmmo">🔸 0</div>
      <div class="chip" id="rMats">🧱 0</div>
    </div>
    <div id="announce"></div>
    <div id="mineBar" class="bar"><i></i></div>
    <div id="bottom">
      <div id="heldName"></div>
      <div id="vitals"><div id="hearts"></div><div id="shieldBar" class="bar hidden"><i></i></div></div>
      <div id="hotbar"></div>
    </div>
    <button id="abilityBtn" class="hidden"><span id="abilityIcon">💨</span><em id="abilityCd"></em></button>
    <div id="dbg"></div>
  </div>

  <!-- Touch controls -->
  <div id="touch" class="hidden">
    <div id="joy"><div id="joyKnob"></div></div>
    <button class="tbtn" id="btnJump">⤒</button>
    <button class="tbtn" id="btnMine">⛏</button>
    <button class="tbtn" id="btnPlace">▣</button>
    <button class="tbtn small" id="btnFly">✈</button>
    <button class="tbtn small" id="btnInv">🎒</button>
    <button class="tbtn small" id="btnCam">👁</button>
    <button class="tbtn small" id="btnBuild">▮</button>
    <button class="tbtn small" id="btnRamp">◢</button>
    <button class="tbtn small" id="btnFloor">▬</button>
  </div>

  <!-- Menus, modals -->
  <div id="ui"></div>
  <div id="toasts"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
