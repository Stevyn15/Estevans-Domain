name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm --prefix mobile ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm --prefix mobile run build:game
      - run: npm --prefix mobile test
      - run: npm --prefix mobile run typecheck
      - run: npm run e2e
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: test-results/

  expo-bundle:
    name: Expo bundles for iOS + Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm --prefix mobile ci
      - run: npm --prefix mobile run build:game
      - run: npx expo export --platform all --output-dir "$RUNNER_TEMP/expo-out"
        working-directory: mobile

  release-readiness:
    name: Release readiness (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run release:check -- --warn

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix mobile audit --omit=dev --audit-level=high
