name: Store assets
# On demand: regenerates store screenshots (iOS 6.7" + Android, captioned), the IAP product CSV and the listing text.
# Download them from the run's "Artifacts" section.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run store:all
      - uses: actions/upload-artifact@v4
        with:
          name: store-assets
          path: store/
