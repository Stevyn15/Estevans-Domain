name: Deploy web demo (GitHub Pages)
# One-time setup: repo Settings → Pages → Source = "GitHub Actions". Gives you a shareable play-in-browser link
# for testers, creators and ad landing tests. NOTE: this is the simulated-purchase build — don't promote it as the store product.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
